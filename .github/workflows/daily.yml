name: 每日股东大会数据更新

on:
  # 每天 UTC 15:00 = 北京时间 23:00
  schedule:
    - cron: "0 15 * * *"
  # 允许手动触发(测试用)
  workflow_dispatch:
    inputs:
      date:
        description: '抓取日期(YYYY-MM-DD,留空=昨天)'
        required: false
        default: ''

permissions:
  contents: write   # 需要写权限以 push 数据回仓库
  pages: write
  id-token: write

# 两个 job 顺序跑
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pypdf openpyxl

      - name: 下载最新数据库(从上次成功运行的 artifact)
        uses: actions/download-artifact@v4
        with:
          name: cninfo-db
          path: data/
        continue-on-error: true   # 首次运行没 artifact,允许失败(用 git 里的 db)

      - name: 确保 db 存在
        run: |
          mkdir -p data
          if [ ! -f data/cninfo.db ]; then
            echo "::warning::没有 cninfo.db,创建一个空 db"
            touch data/cninfo.db
          fi
          ls -la data/

      - name: 运行每日更新
        env:
          DB_PATH: ./data/cninfo.db
          HTML_OUT: ./dist/index.html
          WORK_DIR: ./work
          EXPIRE_DAYS: "0"
        run: |
          mkdir -p data dist work
          if [ -n "${{ inputs.date }}" ]; then
            python daily_update.py "${{ inputs.date }}" || true
          else
            python daily_update.py || true
          fi
          if [ ! -f dist/index.html ] && [ -f data/cninfo.db ]; then
            echo "::warning::update 失败,尝试直接 build_calendar"
            DB_PATH=./data/cninfo.db HTML_OUT=./dist/index.html python build_calendar.py || true
          fi

      - name: 显示摘要
        if: always()
        run: |
          echo "## 📊 更新摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -la data/ dist/ 2>&1 | head -10 >> $GITHUB_STEP_SUMMARY || true
          if [ -f data/cninfo.db ]; then
            python -c "
          import sqlite3
          con = sqlite3.connect('data/cninfo.db')
          try:
              n = con.execute('SELECT COUNT(*) FROM meeting').fetchone()[0]
              print(f'数据库总会议数: {n}')
              for r in con.execute('SELECT source_run, COUNT(*) FROM meeting GROUP BY source_run ORDER BY source_run'):
                  print(f'  {r[0]}: {r[1]} 场')
          except Exception as e:
              print(f'查询失败: {e}')
          " >> $GITHUB_STEP_SUMMARY || true
          fi

      - name: 上传数据库(供下次下载)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cninfo-db
          path: data/cninfo.db
          retention-days: 90
          if-no-files-found: warn

      - name: 部署到 GitHub Pages(用 gh-pages 分支)
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # 如果 gh-pages 分支不存在会自动创建
          # keep_files: false   # 默认会清空,只保留 dist 内容
          force_orphan: true

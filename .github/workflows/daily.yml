name: 每日股东大会数据更新

on:
  # 每天 UTC 15:00 = 北京时间 23:00
  schedule:
    - cron: "0 15 * * *"
  # 允许手动触发(测试用)
  workflow_dispatch:
    inputs:
      date:
        description: '抓取日期(YYYY-MM-DD,留空=昨天)'
        required: false
        default: ''

permissions:
  contents: write   # 需要写权限以发布 Release / push Pages

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pypdf openpyxl

      - name: 下载最新数据库
        uses: actions/download-artifact@v4
        with:
          name: cninfo-db
          path: data/
        continue-on-error: true   # 首次运行没 artifact,允许失败

      - name: 运行每日更新
        env:
          DB_PATH: ./data/cninfo.db
          HTML_OUT: ./dist/index.html
          WORK_DIR: ./work
          EXPIRE_DAYS: "0"
        run: |
          mkdir -p data dist work
          # 支持手动指定日期
          if [ -n "${{ inputs.date }}" ]; then
            # 用户传了日期:用单参模式
            python daily_update.py "${{ inputs.date }}" || true
          else
            python daily_update.py
          fi

      - name: 显示摘要
        run: |
          echo "## 📊 更新摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -la data/ dist/ 2>&1 | head -10 >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f data/cninfo.db ]; then
            python -c "
          import sqlite3
          con = sqlite3.connect('data/cninfo.db')
          n = con.execute('SELECT COUNT(*) FROM meeting').fetchone()[0]
          print(f'数据库总会议数: {n}')
          for r in con.execute('SELECT source_run, COUNT(*) FROM meeting GROUP BY source_run ORDER BY source_run'):
              print(f'  {r[0]}: {r[1]} 场')
          " >> $GITHUB_STEP_SUMMARY
          fi

      - name: 上传数据库(供下次下载)
        uses: actions/upload-artifact@v4
        with:
          name: cninfo-db
          path: data/cninfo.db
          retention-days: 90
          if-no-files-found: error

      - name: 上传 HTML(供 Pages 部署)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
